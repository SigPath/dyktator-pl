name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testy jednostkowe
        run: python3 tests/test_dyktator.py
      - name: Demo przetwarzania (bez mikrofonu)
        run: python3 -m dyktator demo
